<!DOCTYPE html>
<html>
    <head>
        <title>priority order example</title>
        <style>
           *{
            color:red;
           }

           p{
            color:green !important;
           }

           .text{
            color:yellow;
           }

           #title{
            color: orange;   
           }

        </style>
    </head>
    <body>
        <p id="title" class="text" style="color: purple;">
            hello world
        </p>
    </body>
</html>
