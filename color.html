<!DOCTYPE html>
<html>
<head>
<style>
h1{
   color: blue;
}

.rgb{
   color: rgb(255,0,0);
}

.rgba{
   background: rgba(0,255,0,0.5);
   padding: 10px;
}

.hex{
   color: #FF00FF;
}

.opacity{
   opacity: 0;
}
</style>
</head>
<body>

<h1>Color Name Example</h1>

<p class="rgb">RGB Color Example</p>

<div class="rgba">
   RGBA Transparent Background
</div>

<p class="hex">HEX Color Example</p>

<button class="opacity">
   Opacity Button
</button>

</body>
</html>
